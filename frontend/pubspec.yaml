name: frontend
description: "AI Fencing Coach — Standalone On-Device App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Camera
  camera: ^0.12.0+1

  # Postgame clip picking and frame sampling
  image_picker: ^1.1.2
  video_player: ^2.9.2
  video_thumbnail: ^0.5.6

  # TFLite for FenceNet action classification
  tflite_flutter: ^0.11.0

  # Text-to-Speech for coaching feedback
  flutter_tts: ^4.2.5

  # Permission handling
  permission_handler: ^12.0.1

  # Wakelock for preventing screen sleep during session
  wakelock_plus: ^1.6.1

  # Database persistence
  sqflite: ^2.4.1
  path: ^1.9.0

  # Gemini AI summaries
  google_generative_ai: ^0.4.6

  # Save exported video to photo gallery
  image_gallery_saver: ^2.0.3

  # Video playback for annotated video player
  video_player: ^2.9.2

  # Path provider for temp directory access
  path_provider: ^2.1.5

  # Date formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/
